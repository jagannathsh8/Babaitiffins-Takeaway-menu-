<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Babai Console</title>
<link rel="stylesheet" href="/console/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>Babai</b> Console <span id="where" class="mute"></span></div>
  <div class="pills" id="pills"></div>
  <button class="btn ghost sm" id="lockBtn" hidden>Lock</button>
  <span class="clock" id="clock"></span>
</header>
<nav class="mtabs" role="tablist" aria-label="Areas">
  <button class="mt" role="tab" data-area="today">Today</button>
  <button class="mt" role="tab" data-area="printing">Printing</button>
  <button class="mt" role="tab" data-area="screens">Screens</button>
  <button class="mt" role="tab" data-area="metrics">Metrics</button>
  <button class="mt" role="tab" data-area="setup">Setup <span class="lk" aria-label="PIN">🔒</span></button>
</nav>
<nav class="rail" id="rail" aria-label="Sections"></nav>
<div id="banner" class="banner" hidden></div>
<div id="scanToast" class="scantoast" role="status" aria-live="assertive"></div>
<div class="app">
  <main class="main" id="main"></main>
  <iframe id="frame" class="frame" title="Section" hidden></iframe>
</div>
<script src="/console/qrcode.min.js"></script>
<script src="/console/wedge.js"></script>
<script src="/console/app.js"></script>
<script src="/console/metrics.js"></script>
</body>
</html>
