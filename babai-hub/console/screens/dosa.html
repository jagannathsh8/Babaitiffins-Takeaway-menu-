<!doctype html>

<title>Dosa order status</title>
<link rel="stylesheet" href="/screens/common.css">
<style>
.dbg{position:absolute;top:0;left:0;right:0;bottom:0}
.dbg div{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s}
.dbg div.on{opacity:1}
.dbg::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(18,18,18,.92) 0%,rgba(18,18,18,.78) 45%,rgba(18,18,18,.55) 100%)}
.dsv{position:absolute;left:0;right:0;top:7rem;bottom:8.6rem;display:flex;gap:1.4rem;padding:1.2rem 1.6rem}
.dsl,.dsr{background:rgba(23,23,23,.82);border:.15rem solid var(--line);border-radius:1rem;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.9rem;overflow:hidden}
.dsl{flex:1.1}.dsr{flex:1}
.spot{display:flex;flex-direction:column;align-items:center;gap:.2rem;border-radius:1rem;padding:1rem;background:radial-gradient(circle,rgba(63,209,122,.35),rgba(63,209,122,.08) 70%);border:.25rem solid var(--ok);box-shadow:0 0 2rem rgba(63,209,122,.6);position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:1rem;padding:.2rem;background:conic-gradient(from var(--ang),#fff,transparent 25%,transparent 75%,#fff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite;opacity:.7}
.spot .lab{font:800 1rem var(--h2);letter-spacing:.2em;color:#b6f5cf}.spot b{font:800 9rem/1 var(--num);color:#fff;text-shadow:0 0 1.5rem rgba(63,209,122,.9)}.spot .sub{font:600 1.1rem var(--body);color:var(--cream)}
.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;border-radius:1rem;padding:2.4rem 1rem;border:.2rem dashed var(--line);color:var(--muted);font:600 1.3rem var(--body);text-align:center}
.rtoks{display:flex;gap:.8rem;flex-wrap:wrap}.rt{font:800 3rem/1 var(--num);padding:.5rem 1.2rem;border-radius:.7rem;border:.2rem solid var(--ok);background:rgba(63,209,122,.14);color:#fff}
.plist{display:flex;flex-direction:column;gap:.55rem}
.prw{display:flex;align-items:center;gap:.9rem;background:var(--tv3);border-radius:.7rem;padding:.55rem .8rem}
.prw b{font:800 2.5rem/1 var(--num);width:6.5rem}.prw .mid{flex:1;display:flex;flex-direction:column;gap:.3rem}.prw .mid span{font:600 .95rem var(--body);color:var(--muted)}
.bar2{height:.6rem;border-radius:.3rem;background:rgba(255,255,255,.12);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--amber);transition:width 1s}
.prw em{font-style:normal;font:800 1.5rem var(--num);color:var(--amber);width:7rem;text-align:right}
.more{font:700 1.1rem var(--h2);color:var(--muted)}
.dsf{position:absolute;left:0;right:0;bottom:0;height:8.6rem;display:flex;gap:1rem;padding:.9rem 1.6rem 1.2rem;background:linear-gradient(0deg,rgba(18,18,18,.96),rgba(18,18,18,.75))}
.ft{flex:1;background:rgba(23,23,23,.9);border:.15rem solid rgba(249,188,33,.45);border-radius:.9rem;padding:.6rem 1rem;display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.ft span{font:800 .9rem var(--h2);letter-spacing:.14em;color:var(--yellow)}.ft b{font:800 2.4rem/1 var(--num)}.ft p{margin:0;font:600 1.15rem/1.35 var(--body)}
.ft.wide{flex:2.2;background:var(--yellow);border-color:var(--yellow);color:var(--black)}.ft.wide span{color:var(--black)}
.dots{display:flex;gap:.4rem}.dots i{width:1.4rem;height:1.4rem;border-radius:50%;border:.15rem solid var(--yellow)}.dots i.on{background:var(--yellow);box-shadow:0 0 .7rem var(--yellow)}
.callpop{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;background:rgba(10,10,10,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.callpop span{font:800 2rem var(--h2);letter-spacing:.2em;color:var(--yellow)}
.callpop b{font:800 16rem/1 var(--num);color:#fff;text-shadow:0 0 3rem rgba(249,188,33,.9)}
.callpop b.many{font-size:9rem}
.callpop em{font-style:normal;font:800 2.6rem var(--h1);letter-spacing:.06em;color:var(--ok)}
.bar .spk{margin-left:1.2rem}
/* thin neon border running round the panels */
.neon{position:relative}
.neon::after{content:"";position:absolute;top:-.2rem;left:-.2rem;right:-.2rem;bottom:-.2rem;border-radius:1.15rem;padding:.22rem;pointer-events:none;
  background:conic-gradient(from var(--ang),var(--nc),rgba(255,255,255,.9) 6%,var(--nc) 12%,transparent 30%,transparent 50%,var(--nc) 62%,rgba(255,255,255,.9) 68%,var(--nc) 74%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;filter:drop-shadow(0 0 .35rem var(--nc))}
.dsl.neon{--nc:var(--ok)}.dsr.neon{--nc:var(--yellow)}
body.light .dsl.neon{--nc:#16a34a}body.light .dsr.neon{--nc:#f59e0b}

/* brand themes: leaf (cream + banana-leaf green), turmeric (brand yellow), forest (deep green), spice (terracotta) */
body.t-leaf .dsl.neon{--nc:#568B60}body.t-leaf .dsr.neon{--nc:#B66A29}

body.t-leaf .spot{background:radial-gradient(circle,rgba(86,139,96,.22),rgba(86,139,96,.04) 70%);border-color:#568B60;box-shadow:0 0 1.6rem rgba(86,139,96,.35)}

body.t-turmeric .tv{background:#F9BC21}

body.t-turmeric .dbg::after{background:linear-gradient(90deg,rgba(249,188,33,.95),rgba(249,188,33,.9) 45%,rgba(249,188,33,.82))}

body.t-turmeric .prw{background:#fff}body.t-turmeric .bar2{background:#f3e3b8}body.t-turmeric .bar2 i{background:#B66A29}body.t-turmeric .sh.pr,body.t-turmeric .prw em{color:#9a4f12}

body.t-turmeric .ft.wide{background:#171717;border-color:#171717;color:#FFF6DF}body.t-turmeric .ft.wide span{color:#F9BC21}
body.t-turmeric .callpop{background:rgba(249,188,33,.97)}body.t-turmeric .callpop span{color:#171717}body.t-turmeric .callpop b{text-shadow:0 0 2.4rem rgba(255,255,255,.9)}body.t-turmeric .callpop em{color:#2f5a39}
body.t-forest .tv{background:#132a1b}
body.t-forest .dbg::after{background:linear-gradient(90deg,rgba(19,42,27,.95),rgba(19,42,27,.85) 45%,rgba(19,42,27,.66))}

body.t-forest .prw{background:rgba(255,246,223,.07)}body.t-forest .dsl.neon{--nc:#9be37a}body.t-forest .dsr.neon{--nc:#F9BC21}
body.t-forest .dsf{background:linear-gradient(0deg,rgba(19,42,27,.97),rgba(19,42,27,.8))}
body.t-forest .ft{background:rgba(26,56,36,.95);border-color:rgba(249,188,33,.5)}
body.t-forest .ft.wide{background:#F9BC21;border-color:#F9BC21;color:#171717}body.t-forest .ft.wide span{color:#2f5a39}
body.t-forest .callpop{background:rgba(13,30,19,.95)}
body.t-spice .tv{background:#2a1608}
body.t-spice .dbg::after{background:linear-gradient(90deg,rgba(42,22,8,.95),rgba(42,22,8,.85) 45%,rgba(42,22,8,.66))}
body.t-spice .dsl,body.t-spice .dsr{background:rgba(74,38,14,.85);border-color:rgba(249,188,33,.2)}
body.t-spice .prw{background:rgba(255,246,223,.07)}body.t-spice .dsr.neon{--nc:#F9BC21}body.t-spice .dsl.neon{--nc:var(--ok)}
body.t-spice .bar2 i{background:#F9BC21}body.t-spice .prw em{color:#F9BC21}
body.t-spice .dsf{background:linear-gradient(0deg,rgba(42,22,8,.97),rgba(42,22,8,.8))}
body.t-spice .ft{background:rgba(74,38,14,.95);border-color:rgba(249,188,33,.5)}
body.t-spice .ft.wide{background:#B66A29;border-color:#B66A29;color:#FFF6DF}body.t-spice .ft.wide span{color:#F9BC21}

/* a thin neon border, changing colour, running round the whole screen */
.frame{position:absolute;top:0;left:0;right:0;bottom:0;z-index:7;pointer-events:none;padding:.28rem;
  background:conic-gradient(from var(--ang),#F9BC21,#ff4fd8,#29d3ff,#3fd17a,#F9BC21,#B66A29,#ff4fd8,#F9BC21);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 6s linear infinite,hue 9s linear infinite;filter:drop-shadow(0 0 .5rem rgba(255,255,255,.5))}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 .5rem rgba(255,255,255,.5))}}
.bar #thm{margin-left:.8rem}
/* theme picker */
.tpick{position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;background:rgba(10,10,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem}
.tpick>span{font:800 1.6rem var(--h2);letter-spacing:.2em;color:var(--yellow)}
.tpick small{font:600 1.1rem var(--body);color:var(--muted)}
.tps{display:flex;gap:1.4rem}
.tp{width:15rem;border-radius:1.2rem;border:.25rem solid transparent;background:#222;color:#fff;padding:.8rem;cursor:pointer;display:flex;flex-direction:column;gap:.6rem;font:800 1.3rem var(--h2)}
.tp i{display:block;height:7rem;border-radius:.7rem}
.tp[aria-pressed=true]{border-color:var(--yellow)}
.tp:focus{outline:none;border-color:#29d3ff;box-shadow:0 0 1.4rem #29d3ff}
/* Gen-Z: neon blobs, glass panels, gradient numbers, emoji */
body.t-genz .tv{background:radial-gradient(40rem 30rem at 12% 20%,rgba(255,79,216,.38),transparent 70%),radial-gradient(40rem 30rem at 88% 30%,rgba(41,211,255,.32),transparent 70%),radial-gradient(36rem 26rem at 55% 95%,rgba(249,188,33,.3),transparent 70%),#140a26}
body.t-genz .dbg{display:none}
body.t-genz .bar{background:linear-gradient(90deg,#F9BC21,#ff8a3d 45%,#ff4fd8)}
body.t-genz .dsl,body.t-genz .dsr{background:rgba(255,255,255,.08);border:.12rem solid rgba(255,255,255,.22);border-radius:1.6rem;-webkit-backdrop-filter:blur(.8rem);backdrop-filter:blur(.8rem)}
body.t-genz .neon::after{border-radius:1.75rem}
body.t-genz .dsl.neon{--nc:#29d3ff}body.t-genz .dsr.neon{--nc:#ff4fd8}
body.t-genz .sh.ok{color:#7dffb0}body.t-genz .sh.pr{color:#ffb3f0}
body.t-genz .spot{background:rgba(255,255,255,.06);border:.2rem solid #29d3ff;border-radius:1.4rem;box-shadow:0 0 2rem rgba(41,211,255,.55),inset 0 0 2rem rgba(255,79,216,.25)}
body.t-genz .spot .lab{color:#29d3ff}
body.t-genz .spot b{background:linear-gradient(90deg,#F9BC21,#ff4fd8 55%,#29d3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 1rem rgba(255,79,216,.6))}
body.t-genz .rt{border-radius:999px;border-color:#29d3ff;background:rgba(41,211,255,.12);box-shadow:0 0 .8rem rgba(41,211,255,.5)}
body.t-genz .prw{background:rgba(255,255,255,.07);border-radius:1rem}
body.t-genz .bar2{background:rgba(255,255,255,.12)}body.t-genz .bar2 i{background:linear-gradient(90deg,#a6ff00,#29d3ff)}
body.t-genz .prw em{color:#a6ff00}
body.t-genz .dsf{background:transparent}
body.t-genz .ft{background:rgba(255,255,255,.08);border:.12rem solid rgba(255,255,255,.22);border-radius:1.2rem}
body.t-genz .ft span{color:#ffb3f0}
body.t-genz .ft.wide{background:linear-gradient(90deg,#F9BC21,#ffd96b);border:0;color:#171717;box-shadow:0 0 1.4rem rgba(249,188,33,.45)}body.t-genz .ft.wide span{color:#a3127f}
body.t-genz .callpop{background:radial-gradient(50rem 30rem at 50% 50%,rgba(255,79,216,.35),transparent 70%),rgba(20,10,38,.96)}
body.t-genz .callpop b{background:linear-gradient(90deg,#F9BC21,#ff4fd8,#29d3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
body.t-genz .callpop em{color:#a6ff00}
/* the 🔊 and 🎨 buttons fade away after 10 s untouched; any key, touch or mouse brings them back */
.bar .spk{transition:opacity .6s}
body.hushed .bar .spk{opacity:0;pointer-events:none}
body.hushed{cursor:none}
/* busy hours: everything still fits */
.plist.c2,.plist.c3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem .7rem}
.plist.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.plist.c2 .prw,.plist.c3 .prw{padding:.35rem .6rem;gap:.6rem}
.plist.c2 .prw b{font-size:1.9rem;width:4.4rem}.plist.c3 .prw b{font-size:1.6rem;width:3.6rem}
.plist.c2 .prw .mid span,.plist.c3 .prw .mid span{font-size:.8rem}
.plist.c2 .prw em{font-size:1.2rem;width:5rem}.plist.c3 .prw em{font-size:.95rem;width:auto;white-space:nowrap}
.plist.c3{gap:.3rem .5rem}.plist.c3 .prw{padding:.25rem .5rem;gap:.45rem}.plist.c3 .prw b{width:3.2rem}.plist.c3 .prw .mid span{display:none}
.plist.c2 .bar2,.plist.c3 .bar2{height:.45rem}
.plist.c2 .more,.plist.c3 .more{grid-column:1/-1}
.rtoks.sm{gap:.55rem}.rtoks.sm .rt{font-size:2.1rem;padding:.4rem .8rem}
.rtoks.xs{gap:.4rem}.rtoks.xs .rt{font-size:1.6rem;padding:.3rem .6rem}
#spot.small .spot{padding:.5rem;flex-direction:row;justify-content:center;gap:1.4rem}#spot.small .spot b{font-size:5.5rem}
</style>
</head>
<body>
<div class="tv">
  <div class="dbg" id="bg"></div>
  <div class="bar"><img src="/screens/logo.webp" alt=""><div class="t">DOSA ORDER STATUS<small>DINE-IN DOSAS · TASTE THE ANDHRA STYLE</small></div>
    <button class="spk" id="spk" aria-pressed="true" aria-label="Voice calls on">🔊</button><button class="spk" id="thm" aria-label="Choose the screen theme">🎨</button><button class="spk" id="gear" aria-label="Screen settings">⚙</button><div class="clock" id="clock"></div></div>
  <div class="dsv">
    <div class="dsl neon"><div class="sh ok" id="hr">✓ READY · PLEASE COLLECT</div><div id="spot"></div><div class="rtoks" id="rtoks"></div></div>
    <div class="dsr neon"><div class="sh pr" id="hp">⏳ PREPARING · OLDEST FIRST</div><div class="plist" id="plist"></div></div>
  </div>
  <div class="dsf">
    <div class="ft"><span>DOSA WAIT NOW</span><b id="wait">—</b></div>
    <div class="ft"><span id="tawal">PREPARING NOW</span><b id="tawan">—</b></div>
    <div class="ft wide"><span>DID YOU KNOW?</span><p id="fact"></p></div>
  </div>
  <div class="callpop" id="pop" hidden><span>🔊 TOKEN NUMBER</span><b id="popn"></b><em id="pope">DOSA READY · KINDLY COLLECT</em></div>
  <div class="tpick" id="tpick" hidden role="dialog" aria-label="Screen theme"><span>🎨 SCREEN THEME</span><div class="tps" id="tps"></div><small>Arrows to move · OK to choose · Back to close. Kept on this screen.</small></div>
  <div class="frame" aria-hidden="true"></div>
</div>
<script src="/screens/common.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (i) { return document.getElementById(i); };
  var FACTS = ["Pesarattu is Andhra’s green gram dosa, made from whole moong instead of rice batter.", "Karam dosa gets its heat from a red chilli paste spread inside before it is folded.", "Dosa batter is fermented, which makes it light, airy and slightly tangy."];
  var facts = FACTS.slice(), fi = 0, first = true, known = {}, popT = null;
  BS.clock($("clock"));
  // themes the screen can pick with 🎨 (kept on this screen); ?theme= also works
  var THEMES = [["green", "Green", "linear-gradient(135deg,#132a1b,#2f5a39 60%,#F9BC21)"], ["white", "White", "linear-gradient(135deg,#fff,#f3f4f6 60%,#F9BC21)"],
    ["black", "Black", "linear-gradient(135deg,#121212,#262626 60%,#F9BC21)"], ["turmeric", "Turmeric", "linear-gradient(135deg,#F9BC21,#e8a90f 60%,#171717)"],
    ["genz", "Gen-Z ✨", "linear-gradient(135deg,#ff4fd8,#7b5ce6 45%,#29d3ff 75%,#F9BC21)"]];
  var ALIAS = { forest: "green", dark: "black", night: "black" };
  var TEXT = { def: ["✓ READY · PLEASE COLLECT", "⏳ PREPARING · OLDEST FIRST", "DOSA READY · KINDLY COLLECT", "collect at the counter"],
    genz: ["✨ READY · COME GRAB IT", "🔥 ON THE TAWA · YOUR TURN SOON", "YOUR DOSA IS READY 🎉", "come grab it 🙌"] };
  var theme = "black", words = TEXT.def;
  function setTheme(t) {
    t = ALIAS[t] || t;
    if (!THEMES.some(function (x) { return x[0] === t; }) && ["cream", "leaf", "spice"].indexOf(t) < 0) t = "black";
    theme = t;
    var LIGHT = { white: "#ffffff", cream: "#FFF6DF", leaf: "#FFF6DF", turmeric: "#F9BC21" };
    var cls = { green: "t-forest", black: "", genz: "t-genz", spice: "t-spice" }[t];
    var hushed = document.body.classList.contains("hushed"); // keep the faded buttons faded
    document.body.className = (LIGHT[t] ? "light t-" + t : cls || "") + (hushed ? " hushed" : "");
    if (LIGHT[t]) document.documentElement.style.setProperty("--bgc", LIGHT[t]);
    words = t === "genz" ? TEXT.genz : TEXT.def;
    $("hr").textContent = words[0]; $("hp").textContent = words[1]; $("pope").textContent = words[2];
    BS.store("bs.theme.dosa", t);
    if (window.LAST) draw(window.LAST);
  }
  function openPick() {
    $("tps").innerHTML = THEMES.map(function (x) { return '<button class="tp" data-t="' + x[0] + '" aria-pressed="' + (x[0] === theme) + '"><i style="background:' + x[2] + '"></i>' + x[1] + "</button>"; }).join("");
    $("tpick").hidden = false;
    var cur = $("tps").querySelector('[aria-pressed="true"]') || $("tps").firstChild; cur.focus();
  }
  function closePick() { $("tpick").hidden = true; $("thm").focus(); }
  $("thm").onclick = openPick;
  $("tps").addEventListener("click", function (e) { var b = e.target.closest(".tp"); if (b) { setTheme(b.getAttribute("data-t")); closePick(); } });
  document.addEventListener("keydown", function (e) {
    if ($("tpick").hidden) return;
    var bs = [].slice.call($("tps").children), i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); bs[(i + (e.key === "ArrowRight" ? 1 : bs.length - 1) + bs.length) % bs.length].focus(); }
    else if (e.key === "Escape" || e.key === "GoBack" || e.key === "BrowserBack") { e.preventDefault(); closePick(); }
  });
  window.babaiBack = function () { if (BS.setOpen()) { BS.closeSettings(); return true; } if (!$("tpick").hidden) { closePick(); return true; } return false; };
  $("gear").onclick = function () { wake(); BS.settings(function () { $("gear").focus(); wake(); }); };
  function plural(n, a, b) { return n + " " + (n === 1 ? a : b); }
  function spoken(l) { l = String(l); return /^T\d/.test(l) ? "table " + l.slice(1) : l.replace(/^#/, ""); }

  function draw(j) {
    window.LAST = j;
    if (j.clr) BS.clr = j.clr;
    var T = j.tokens || {}, M = j.meta || {}, rd = [], pr = [];
    Object.keys(T).forEach(function (k) { var t = T[k]; if (t.s === "r") rd.push(t); else if (t.s === "p") pr.push(t); });
    rd.sort(function (a, b) { return (b.a || 0) - (a.a || 0); });
    pr.sort(function (a, b) { return a.pos - b.pos; });
    $("spot").innerHTML = rd.length ? '<div class="spot"><span class="lab">LATEST READY</span><b>' + BS.esc(rd[0].l) + '</b><span class="sub">' + plural(rd[0].d || 1, "dosa", "dosas") + " · " + words[3] + "</span></div>"
      : '<div class="idle">Your token number will appear here when it’s ready</div>';
    // every ready token shows: smaller as the list grows (a customer must always find theirs)
    var more = rd.slice(1, 41), rk = more.length > 24 ? " xs" : more.length > 8 ? " sm" : "";
    $("rtoks").className = "rtoks" + rk; $("spot").className = rd.length > 10 ? "small" : "";
    $("rtoks").innerHTML = more.map(function (t, i) { return '<span class="rt" style="opacity:' + Math.max(0.55, 1 - i * 0.04).toFixed(2) + '">' + BS.esc(t.l) + "</span>"; }).join("") + (rd.length > 41 ? '<span class="more">+' + (rd.length - 41) + "</span>" : "");
    // every preparing token shows: 1 column up to 8, then 2 columns (compact), then 3
    var cols = pr.length <= 8 ? 1 : pr.length <= 20 ? 2 : 3, show = pr.slice(0, cols === 3 ? 33 : 20);
    $("plist").className = "plist c" + cols;
    $("plist").innerHTML = show.map(function (t) {
      var el = BS.since(t.c || BS.now(), true) / 60, m = t.m > 0 ? t.m : null, pc = m ? Math.min(95, Math.max(4, 100 * el / (el + m))) : 10;
      return '<div class="prw"><b>' + BS.esc(t.l) + '</b><div class="mid"><span>' + plural(t.d || 1, "dosa", "dosas") + (t.o ? " · next round" : "") + '</span><div class="bar2"><i style="width:' + pc.toFixed(0) + '%"></i></div></div><em>' + (m ? "~" + m + " min" : el >= 1 ? Math.floor(el) + " min" : "just in") + "</em></div>";
    }).join("") + (pr.length > show.length ? '<div class="more">+ ' + (pr.length - show.length) + " more preparing</div>" : "") + (pr.length ? "" : '<p class="empty">No dosas waiting right now.</p>');
    $("wait").textContent = M.w || "—";
    // the dosa master's barker knows what is on the tawa; without it, the dosas still being made
    var cooking = pr.reduce(function (a, t) { return a + (t.d || 1); }, 0);
    if (j.tawa >= 0) { $("tawal").textContent = "ON THE TAWA NOW"; $("tawan").textContent = plural(j.tawa, "dosa", "dosas"); }
    else { $("tawal").textContent = "PREPARING NOW"; $("tawan").textContent = cooking ? plural(cooking, "dosa", "dosas") : "—"; }
    if (M.f && M.f.length) facts = M.f.concat(FACTS);
    if (!$("fact").textContent) $("fact").textContent = facts[0];
    calls(rd);
  }
  setInterval(function () { fi = (fi + 1) % facts.length; $("fact").textContent = facts[fi]; }, 15000);

  // ---- calls: tokens that turn ready within 3 s are called together, with the full-screen pop-up;
  // called again once after a minute if still not collected.
  var pending = [], gatherT = null;
  function calls(rd) {
    var now = Date.now(), live = {};
    rd.forEach(function (t) {
      live[t.l] = 1;
      if (!known[t.l]) { known[t.l] = { at: now, n: first ? 2 : 0 }; if (!first) pending.push(t.l); }
      else if (known[t.l].n === 1 && now - known[t.l].at >= 60000) { known[t.l].n = 2; pending.push(t.l); }
    });
    for (var k in known) if (!live[k]) delete known[k];
    first = false;
    if (pending.length && !gatherT) gatherT = setTimeout(function () {
      gatherT = null; var call = pending.filter(function (l) { return known[l]; }); pending = [];
      if (!call.length) return;
      call.forEach(function (l) { known[l].n = Math.max(known[l].n, 1); known[l].at = known[l].n === 1 ? Date.now() : known[l].at; });
      $("popn").textContent = call.join(" · "); $("popn").className = call.length > 2 ? "many" : "";
      $("pop").hidden = false; clearTimeout(popT); popT = setTimeout(function () { $("pop").hidden = true; }, 7000);
      BS.say("Token number " + call.map(spoken).join(", ") + ", dosa ready, kindly collect.", true);
    }, 3000);
  }
  var spk = $("spk");
  function spkUI() { var v = BS.voiceOn(); spk.textContent = v ? "🔊" : "🔇"; spk.setAttribute("aria-pressed", String(v)); }
  spk.onclick = function () { BS.voiceOn(!BS.voiceOn()); spkUI(); };
  spkUI();
  var idleT = null;
  function wake() { document.body.classList.remove("hushed"); clearTimeout(idleT); idleT = setTimeout(function () { if ($("tpick").hidden && !BS.setOpen()) document.body.classList.add("hushed"); else wake(); }, 10000); }
  ["keydown", "mousemove", "pointerdown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, wake, true); });
  wake();
  setTheme(BS.q.theme || BS.store("bs.theme.dosa") || "black");

  // ---- photos behind the screen (the outlet's own, or the built-in dish photos)
  BS.get("/screens/api/photos", function (err, j) {
    var list = (j && j.photos && j.photos.length) ? j.photos : ["/screens/bg1.jpg", "/screens/bg2.jpg", "/screens/bg3.jpg"], i = 0;
    $("bg").innerHTML = list.map(function (u) { return '<div style="background-image:url(\'' + u + '\')"></div>'; }).join("");
    var ds = $("bg").children; if (ds[0]) ds[0].className = "on";
    if (ds.length > 1) setInterval(function () { ds[i].className = ""; i = (i + 1) % ds.length; ds[i].className = "on"; }, 8000);
  });

  BS.poll("/screens/api/dosa", 1500, draw);
})();
</script>
