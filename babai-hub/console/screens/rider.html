<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rider TV</title>
<link rel="stylesheet" href="/screens/common.css">
<style>
.rmain{position:absolute;left:0;right:0;top:7rem;bottom:0;display:flex;flex-direction:column;padding:.9rem 1.2rem;gap:.5rem}
.fit{display:grid;gap:6px;align-content:start;flex:none}
.rc{position:relative;display:flex;align-items:center;gap:.5em;border-radius:.4em;background:var(--tv3);padding:0 .45em 0 0;overflow:hidden;font-size:var(--fs);height:1.3em}
.rc .b{align-self:stretch;width:1.4em;display:grid;place-items:center;font:800 .62em var(--num);color:#fff;background:var(--c)}
.rc .n{font:800 1em/1.3 var(--num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.rc .tm2{font:700 .36em/1 var(--num);color:#b6f5cf;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
.rc .s{margin-left:.35em;font:800 .78em/1 var(--num);background:var(--yellow);color:var(--black);border-radius:.18em;padding:.12em .3em;min-width:1.9em;text-align:center}
.rc.ready{background:linear-gradient(90deg,rgba(63,209,122,.2),rgba(63,209,122,.06));box-shadow:0 0 .35em rgba(63,209,122,.55)}
.rc.ready::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:.4em;padding:.07em;background:conic-gradient(from var(--ang),var(--ok),transparent 30%,transparent 70%,var(--ok));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite;pointer-events:none}
.rc.prep{opacity:.88}.rc.prep .tm2{color:var(--amber)}
.rc.prep .s{background:transparent;color:var(--yellow);box-shadow:inset 0 0 0 .08em var(--yellow)}
.tsrch{position:absolute;left:0;right:0;top:7rem;bottom:0;z-index:4;background:rgba(10,10,10,.92);display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding-top:4rem}
.tsb{display:flex;flex-direction:column;align-items:center;gap:.8rem}
.tsb>span:first-child{font:800 1.4rem var(--h2);letter-spacing:.16em;color:var(--yellow)}
#tsq{width:28rem;font:800 5rem/1 var(--num);letter-spacing:.3em;text-align:center;border:.3rem solid var(--yellow);border-radius:1rem;padding:.6rem;background:var(--black);color:#fff}
.tsh{font:600 1rem var(--body);color:var(--muted)}
.tres{min-width:40rem;border-radius:1.2rem;padding:1.4rem 2rem;background:var(--tv2);border:.25rem solid var(--c);display:flex;flex-direction:column;gap:.4rem}
.tres .k{font:800 1.1rem var(--h2);letter-spacing:.16em;color:var(--muted)}
.tres .row2{display:flex;align-items:baseline;gap:2rem}
.tres .row2 b{font:800 6rem/1 var(--num)}
.tres .row2 span{font:800 2.2rem var(--h2);color:var(--ok)}.tres .row2 span.p{color:var(--amber)}
.tres .sl{font:800 3rem var(--h2);color:var(--yellow)}
.tres .mt{font:600 1.2rem var(--body);color:var(--cream)}
.tres ul{margin:.4rem 0 0;padding-left:1.4rem;font:500 1.2rem var(--body);color:var(--cream)}
</style>
</head>
<body>
<div class="tv">
  <div class="bar"><img src="/screens/logo.webp" alt=""><div class="t">RIDER PICKUP<small>FIND YOUR LAST 4 DIGITS · GO TO THE SLOT</small></div>
    <div class="cnt"><span class="r"><b id="cr">0</b> READY</span><span><b id="cp">0</b> PREPARING</span></div>
    <button class="spk" id="tsbtn" aria-label="Find an order">🔍</button><button class="spk" id="spk" aria-pressed="true" aria-label="Voice calls on">🔊</button><div class="clock" id="clock"></div></div>
  <div class="rmain" id="rmain">
    <div class="sh ok" id="h1">✓ READY · TAKE FROM YOUR SLOT <i>latest ready first · time since ready</i></div>
    <div class="fit" id="fr"></div>
    <div class="sh pr" id="h2">⏳ PREPARING <i>oldest first · time since order</i></div>
    <div class="fit" id="fp"></div>
  </div>
  <div class="tsrch" id="ts" hidden role="dialog" aria-label="Find an order">
    <div class="tsb"><span>🔍 FIND AN ORDER</span><input id="tsq" inputmode="numeric" maxlength="4" placeholder="Last 4 digits" aria-label="Last 4 digits"><span class="tsh">Number keys to type · OK to search · Back to close</span></div>
    <div id="tsres"></div>
  </div>
</div>
<script src="/screens/common.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (i) { return document.getElementById(i); };
  var ORD = [], first = true, seen = {}, lastCall = 0;
  BS.clock($("clock"));
  function last4(o) { var d = String(o.o || "").replace(/\D/g, ""); return d.length > 4 ? d.slice(-4) : d; }

  // every card fits: the column count that gives the biggest cards in the box
  function fit(el, list, ready, h) {
    var w = el.clientWidth || $("rmain").clientWidth - 24, n = list.length, best = { cols: 1, fs: 8 };
    for (var cols = 1; cols <= 16; cols++) {
      var rows = Math.ceil(n / cols), cw = (w - (cols - 1) * 6) / cols, ch = (h - (rows - 1) * 6) / rows;
      var fs = Math.min(cw / 8.4, ch / 1.3, w / 14);
      if (fs > best.fs) best = { cols: cols, fs: fs };
    }
    el.style.setProperty("--fs", best.fs.toFixed(1) + "px");
    el.style.gridTemplateColumns = "repeat(" + best.cols + ",minmax(0,1fr))";
    el.innerHTML = list.map(function (o) {
      var br = BS.brand(o.p), t = ready ? o.ra || o.c : o.c;
      return '<div class="rc ' + (ready ? "ready" : "prep") + '" style="--c:' + br.c + '"><span class="b">' + br.b + '</span><span class="n">' + BS.esc(last4(o)) + '</span><span class="tm2" data-t="' + t + '" data-b="' + (ready && o.ra ? 0 : 1) + '">' + BS.mmss(BS.since(t, !(ready && o.ra))) + "</span>" + (o.s ? '<span class="s">' + BS.esc(o.s) + "</span>" : "") + "</div>";
    }).join("");
  }
  function draw() {
    var rd = ORD.filter(function (o) { return o.r; }).sort(function (a, b) { return (b.ra || b.c) - (a.ra || a.c); });
    var pr = ORD.filter(function (o) { return !o.r; }).sort(function (a, b) { return a.c - b.c; });
    $("cr").textContent = rd.length; $("cp").textContent = pr.length;
    var avail = $("rmain").clientHeight - $("h1").offsetHeight - $("h2").offsetHeight - 40;
    var share = !pr.length ? 0.95 : !rd.length ? 0.05 : Math.max(0.45, Math.min(0.72, rd.length / Math.max(1, rd.length + pr.length * 0.7)));
    fit($("fr"), rd, true, avail * share); fit($("fp"), pr, false, avail * (1 - share));
    if (!$("ts").hidden) find();
  }
  BS.onresize = draw;
  setInterval(function () { document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = BS.mmss(BS.since(+e.getAttribute("data-t"), e.getAttribute("data-b") === "1")); }); }, 1000);

  // ---- voice calls: new ready orders at once (with a chime), then every waiting one again every
  // 30 s until it is picked up; at most 6 in one call; none after 3 hours ready.
  function phrase(list) {
    return list.map(function (o) { return String(o.p || "").replace(/\//g, " ") + " " + BS.digits(last4(o)) + (o.s ? ", slot " + o.s : "") + "."; }).join(" ");
  }
  function calls() {
    var now = Date.now(), ready = ORD.filter(function (o) { return o.r; }), fresh = [];
    ready.forEach(function (o) { var s = seen[o.id]; if (!s) { s = seen[o.id] = { at: now, called: first ? now : 0 }; } if (!s.called && now - s.at >= 3000) fresh.push(o); });
    var live = {}; ORD.forEach(function (o) { live[o.id] = 1; }); for (var k in seen) if (!live[k]) delete seen[k];
    first = false;
    if (BS.busy()) return;
    var call = fresh.slice(0, 6), chime = call.length > 0;
    if (!call.length && now - lastCall >= 30000) {
      call = ready.filter(function (o) { return now - (o.ra ? o.ra : seen[o.id].at) < 3 * 3600e3; })
        .sort(function (a, b) { return (seen[a.id].called || 0) - (seen[b.id].called || 0); }).slice(0, 6);
    }
    if (!call.length) return;
    call.forEach(function (o) { seen[o.id].called = now; });
    lastCall = now;
    BS.say(phrase(call), chime);
  }
  setInterval(calls, 1000);
  var spk = $("spk");
  function spkUI() { var v = BS.voiceOn(); spk.textContent = v ? "🔊" : "🔇"; spk.setAttribute("aria-pressed", String(v)); spk.setAttribute("aria-label", v ? "Voice calls on" : "Voice calls off"); }
  spk.onclick = function () { BS.voiceOn(!BS.voiceOn()); spkUI(); };
  spkUI();

  // ---- staff search: 🔍, number keys, the remote
  function find() {
    var q = $("tsq").value.replace(/\D/g, ""), el = $("tsres");
    if (q.length < 4) { el.innerHTML = ""; return; }
    var o = ORD.filter(function (x) { return last4(x) === q; })[0];
    if (!o) { el.innerHTML = '<div class="tres" style="--c:var(--late)"><span class="k">NOT FOUND</span><span class="mt">No order ending ' + q + " on the board. Check the digits.</span></div>"; return; }
    var br = BS.brand(o.p);
    el.innerHTML = '<div class="tres" style="--c:' + br.c + '"><span class="k">' + BS.esc(String(o.p).toUpperCase()) + ' ORDER</span><div class="row2"><b>…' + q + '</b><span class="' + (o.r ? "" : "p") + '">' + (o.r ? "READY ✓" : "PREPARING") + "</span></div>" +
      (o.s ? '<span class="sl">Slot ' + BS.esc(o.s) + "</span>" : "") + '<span class="mt">' + (o.r ? "Ready " + BS.mmss(BS.since(o.ra || o.c, !o.ra)) : "Ordered " + BS.mmss(BS.since(o.c, true))) + " ago</span>" +
      (o.i && o.i.length ? "<ul>" + o.i.map(function (x) { return "<li>" + BS.esc(x) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
  }
  function open(d) { $("ts").hidden = false; $("tsq").value = d || ""; $("tsq").focus(); find(); }
  function close() { $("ts").hidden = true; $("tsbtn").focus(); }
  $("tsbtn").onclick = function () { open(""); };
  $("tsq").addEventListener("input", find);
  document.addEventListener("keydown", function (e) {
    var isOpen = !$("ts").hidden, k = e.key;
    if (isOpen && (k === "Escape" || k === "GoBack" || k === "BrowserBack" || k === "Backspace" && !$("tsq").value)) { e.preventDefault(); close(); return; }
    if (!isOpen && /^[0-9]$/.test(k)) { e.preventDefault(); open(k); return; }
    if (!isOpen && (k === "ArrowLeft" || k === "ArrowRight")) { var b = [$("tsbtn"), spk], i = b.indexOf(document.activeElement); b[(i + (k === "ArrowRight" ? 1 : b.length - 1)) % b.length].focus(); e.preventDefault(); }
  });
  window.babaiBack = function () { if (!$("ts").hidden) { close(); return true; } return false; }; // the app's Back key

  BS.poll("/screens/api/rider", 2000, function (j) { ORD = j.orders || []; draw(); });
})();
</script>
</body>
</html>
